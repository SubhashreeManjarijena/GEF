function tick(id){const c=cs(id),n=new Set(c.ev.map(e=>e.i)).size;let t=v('tt')?new Date(v('tt')).toISOString():iso();const last=c.ev.length?eff(c,n-1):null;

else if(WS==4)h=`<h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">4. Observed Electrical Energy State &amp; Safety Compliance</h3><div class="warn"><b>Safety Disclaimer:</b> This application records field engineering observations only. It does NOT authorize electrical switching or issue safety permits. Switching must follow utility protocol.</div><div class="mt-4 p-4 bg-slate-50 border border-slate-200 rounded-xl text-xs"><div class="font-semibold text-slate-700 mb-2">Observed Energy State for ${pn} — ${pl}:</div><div class="grid grid-cols-1 md:grid-cols-3 gap-3">${[['Energized','Equipment live under operating voltage'],['De-energized','Isolated, grounded and earthed per safety permit'],['Not verified','Exception state: requires supervisor review']].map(x=>`<button type="button" role="radio" aria-checked="${p.en==x[0]}" onclick="PU(${PS},'en','${x[0]}');draw()" class="text-left p-3 rounded-lg border ${p.en==x[0]?'bg-blue-50 border-blue-400':'bg-white border-slate-200'}"><div class="font-semibold text-slate-900">${p.en==x[0]?'✓ ':''}${x[0].replace('verified','Verified')}</div><div class="text-slate-500">${x[1]}</div></button>`).join('')}</div>${p.en=='Not verified'?'<div class="mt-3">'+P_('er','Reason energisation was not verified')+'</div>':''}</div>`;
else if(WS==5){const IT=[['enc','MECHANICAL & ENCLOSURE','Enclosure integrity, door interlocks and seals'],['sf6','INSULATION & GAS','SF6 gas pressure gauge reading and density switch'],['ear','EARTHING & PROTECTION','Earthing switch manual locking & mechanical interlock'],['rtu','CONTROL & RTU','RTU auxiliary supply, battery backup, and trip signals']],bad=Object.values(p.chk).some(x=>x=='Fail'||x=='Not Checked');
h=`<h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">5. Technical Inspection Checklist for ${pn} — ${pl}</h3><p class="text-xs text-slate-500">Rule: Any item marked 'Fail' or 'Not Checked' requires an explicit reason and action.</p><div class="flex flex-wrap gap-2 mt-2">${pills}</div>${IT.map(i=>`<div class="mt-3 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs"><div class="flex flex-wrap items-center justify-between gap-2"><div><div class="font-mono text-[10px] text-blue-600 font-semibold">${i[1]}</div><div class="font-semibold text-slate-900">${i[2]}</div></div><div class="seg" role="radiogroup" aria-label="${i[2]}">${['Pass','Fail','Not Checked','Not Applicable'].map(o=>`<button type="button" role="radio" aria-checked="${p.chk[i[0]]==o}" class="${p.chk[i[0]]==o?(o=='Pass'?'p':o=='Fail'?'f':'n'):''}" onclick="PU(${PS},'chk.${i[0]}','${o}');draw()">${o}</button>`).join('')}</div></div></div>`).join('')}${bad?`<div class="mt-3 p-3 rounded-xl text-xs" style="background:#fef2f2;border:1px solid #fecaca"><div class="grid grid-cols-1 md:grid-cols-2 gap-4">${P_('rs','Reason for Fail / Not Checked (Mandatory)')}${P_('ca','Corrective Action / Exception Plan')}</div></div>`:''}<h3 class="text-sm font-bold text-slate-900 mt-4">Reading</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs mt-2">${wi('Value',p.rd.v,`PU(${PS},'rd.v',this.value)`)}${wsel('Unit',p.rd.u,`PU(${PS},'rd.u',this.value)`,S.lists.units)}${wsel('Method',p.rd.m,`PU(${PS},'rd.m',this.value)`,S.lists.methods)}${wi('Time',p.rd.t,`PU(${PS},'rd.t',this.value)`,{t:'time',e:'rdt'+PS})}</div>`}
else if(WS==6)h=`<h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">6. Engineering Findings vs Customer Allegations for ${pn} — ${pl}</h3><p class="text-xs text-slate-500">Rule: Keep the customer allegation strictly separate from verified engineering findings and root cause.</p><div class="flex flex-wrap gap-2 mt-2">${pills}</div><div class="text-xs mt-3 space-y-4">${wi('Original Customer Allegation',c.text,'',{dis:1})}${wta('Verified Technical Findings (Engineering Truth)',p.find,`PU(${PS},'find',this.value)`,'find'+PS)}<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${wta('Root Cause Classification',p.cause,`PU(${PS},'cause',this.value)`)}${wta('Solution &amp; Corrective Work Done',p.act,`PU(${PS},'act',this.value)`)}</div><div class="grid grid-cols-1 md:grid-cols-2 gap-4">${wsel('Follow-up owner (needed if Fail / Not Checked)',p.fo,`PU(${PS},'fo',this.value)`,[['','None'],...S.users.filter(u=>u.on).map(u=>[u.id,u.name])],'fo'+PS)}${wi('Follow-up due date',p.fd,`PU(${PS},'fd',this.value)`,{t:'date',e:'fd'+PS})}</div><label class="flex items-center justify-between p-3 rounded-xl" style="background:#fffbeb;border:1px solid #fde68a"><span><b class="text-amber-800">Flag Non-Conformance Report (NCR)?</b><br><span class="text-amber-800">Triggers independent QCA review and defect tracking.</span></span><input type="checkbox" style="width:18px;height:18px" ${p.ncr?'checked':''} onchange="PU(${PS},'ncr',this.checked)"></label></div>`;
else if(WS==7)h=`<h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">7. Spare Parts Used &amp; Photo/GPS Evidence</h3><div class="mt-3 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs flex items-center justify-between gap-2"><div><div class="font-semibold text-slate-900">Site GPS Coordinates (${pn})</div><div class="text-slate-500">${p.gps?p.gps.lat+', '+p.gps.lon+' ('+esc(p.gps.m)+', ±'+p.gps.acc+' m, '+fmt(p.gps.t)+')':'No GPS captured yet'}</div></div><button type="button" class="btn" onclick="gps('${c.id}',${PS})">Capture GPS</button></div><h3 class="text-xs font-bold text-slate-900 mt-4">Defective / Replaced Component Lines</h3>${(r.parts||[]).map((x,i)=>`<div class="mt-2 p-3 border border-slate-200 rounded-xl text-xs flex justify-between"><span><b>${esc(x.d)}</b><br><span class="font-mono text-slate-500">Part #${esc(x.no)} · Qty: ${x.q} · ${x.w}</span></span><button type="button" class="btn r" onclick="rmPart(${i})">Remove</button></div>`).join('')||'<p class="text-xs text-slate-500 mt-1">No component lines yet.</p>'}<div class="grid grid-cols-2 md:grid-cols-5 gap-2 text-xs mt-3 items-end">${wi('Description','','','','',{}).replace('oninput=""','id="pt_d"')}${wi('Part #','').replace('<input','<input id="pt_n"')}${wi('Qty','1','',{t:'number'}).replace('<input','<input id="pt_q"')}<div><label class="font-semibold text-slate-700 block mb-1">Warranty</label><select id="pt_w" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg"><option>Under Warranty</option><option>Out of Warranty</option></select></div><button type="button" class="btn p" onclick="addPart()">Add line</button></div><span class="err" id="e_pt"></span><div class="mt-4">${upUI(c.files,c.id,false)}</div>`;
else{const probs=[];h=`<h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">8. Final Review &amp; Supervisor Submission</h3><div class="mt-3 p-4 bg-slate-50 border border-slate-200 rounded-xl text-xs"><div class="grid grid-cols-2 md:grid-cols-4 gap-4"><div><span class="text-slate-500">Work Order</span><div class="font-mono font-bold">${woId(c)}</div></div><div><span class="text-slate-500">Site Name</span><div class="font-semibold">${esc(c.site)}</div></div><div><span class="text-slate-500">Total Panels</span><div class="font-semibold text-blue-600">${n} Panel(s)</div></div><div><span class="text-slate-500">Reporting Engineer</span><div class="font-semibold">${esc(me.name)}</div></div></div><div class="mt-3 p-3 rounded-lg" style="background:#eff6ff;border:1px solid #bfdbfe"><b>Engineer Submission Declaration:</b> I hereby certify that the inspections, measurements, and equipment observations recorded above are accurate and conducted in accordance with technical procedures.</div></div>${Object.keys(ERR).length?`<div class="warn"><b>Fix these before submitting:</b><ul>${Object.values(ERR).map(m=>'<li>'+m+'</li>').join('')}</ul></div>`:''}`}
return`<div class="mt-4 flex items-center gap-1 overflow-x-auto pb-2 scrollbar-none" role="tablist">${tabs}</div><fieldset ${own?'':'disabled'} style="border:0;padding:0;margin:0;min-width:0"><div class="mt-6 space-y-4">${h}</div></fieldset>${own?'':'<p class="hint">View only: only the assigned engineer can edit this report.</p>'}<div class="mt-8 pt-4 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2"><button type="button" onclick="WS--;draw()" ${WS==1?'disabled':''} class="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-100 disabled:opacity-40 flex items-center gap-1.5">${ic('chevron-right','w-4 h-4 rotate-180')}<span>Previous Step</span></button><div class="row" style="margin:0"><button type="button" class="btn" onclick="saveD('${c.id}')"${own?'':' disabled'}>Save draft</button>${WS<8?`<button type="button" onclick="WS++;draw()" class="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5"><span>Next Step</span>${ic('chevron-right','w-4 h-4')}</button>`:`<button type="button" class="btn p" onclick="submitR('${c.id}')"${why(own,'Only the assigned engineer can submit')}>Submit Technical Report</button>`}</div></div>`}
function addPart(){const r=cur(cs(CID)),d=v('pt_d').trim(),q=+v('pt_q');if(!d||!(q>0)){$('#e_pt').textContent='Enter a description and a quantity above 0.';return toast('Component line needs a description and quantity.',1)}(r.parts=r.parts||[]).push({d,no:v('pt_n').trim()||'—',q,w:v('pt_w')});toast('Added '+d);draw()}
function rmPart(i){cur(cs(CID)).parts.splice(i,1);draw()}
function submitR(id){const c=cs(id),r=cur(c),pr=[];ERR={};const add=(st,pi,k,m)=>{ERR[k]=m;pr.push([st,pi])};
if(new Set(c.ev.map(e=>e.i)).size<6)add(2,0,'tl','Complete all six time-log actions first (step 2).');
r.panels.forEach((p,i)=>{const pn='Panel '+(i+1)+': ',bad=Object.values(p.chk).some(x=>x=='Fail'||x=='Not Checked');
if(!p.serial.trim())add(3,i,'serial'+i,pn+'enter the serial number.');if(p.en=='Not verified'&&!p.er.trim())add(4,i,'er'+i,pn+'give a reason energisation was not verified.');
if(bad&&!p.rs.trim())add(5,i,'rs'+i,pn+'explain every Fail or Not Checked item.');if(bad&&!p.ca.trim())add(5,i,'ca'+i,pn+'add the corrective action or exception plan.');
if(p.rd.v&&!p.rd.t)add(5,i,'rdt'+i,pn+'add the reading time.');if(bad&&!p.find.trim())add(6,i,'find'+i,pn+'add verified technical findings.');if(bad&&!p.fo)add(6,i,'fo'+i,pn+'choose a follow-up owner.');if(bad&&!p.fd)add(6,i,'fd'+i,pn+'enter a follow-up due date.')});
if(pr.length){const f=pr.sort((a,b)=>a[0]-b[0])[0];WS=f[0];PS=f[1];draw();return toast('The report can’t be submitted yet. Problems are marked beside each field.',1)}
r.st='Submitted';r.locked=true;c.st='Submitted for review';A(id,'Report submitted','Revision '+r.n+', '+r.panels.length+' panel(s)');
const fl=r.panels.find(p=>p.ncr);if(fl&&!c.ncr){c.ncr={no:'NCR-2026-'+String(S.cases.filter(x=>x.ncr).length+20).padStart(4,'0'),desc:fl.find||'NCR flagged from site inspection',st:'Raised',by:me.id};A(id,'NCR raised (auto from inspection)',c.ncr.no)}
toast('Revision '+r.n+' submitted for supervisor review'+(fl?' · '+c.ncr.no+' raised':''));WS=1;PS=0;T='rv';draw()}
EXTP.visit=visitPg;

seed();me=S.users.find(u=>u.id=='u9');draw();
</script></body></html>
